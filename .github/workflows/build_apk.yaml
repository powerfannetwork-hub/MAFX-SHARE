name: Build MAFX SHARE APK

'on':
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build MAFX SHARE APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify project
        shell: bash
        run: |
          set -e

          test -f pubspec.yaml
          test -f lib/main.dart

          flutter --version
          java -version

      - name: Regenerate Android project with modern Flutter
        shell: bash
        run: |
          set -euo pipefail

          echo "Backing up the current Android manifest..."
          cp android/app/src/main/AndroidManifest.xml \
            "$RUNNER_TEMP/MAFX-AndroidManifest.xml"

          echo "Generating a fresh Android V2 project..."
          flutter create \
            --platforms=android \
            --org com.mafx \
            --project-name mafx_share \
            --overwrite \
            "$RUNNER_TEMP/mafx_android_v2"

          echo "Replacing the old Android scaffold..."
          rm -rf android
          cp -a "$RUNNER_TEMP/mafx_android_v2/android" ./android

          echo "Restoring MAFX SHARE Android permissions and settings..."
          cp "$RUNNER_TEMP/MAFX-AndroidManifest.xml" \
            android/app/src/main/AndroidManifest.xml

          echo "Checking Android V2 MainActivity..."
          ACTIVITY="android/app/src/main/kotlin/com/mafx/share/MainActivity.kt"

          if [ ! -f "$ACTIVITY" ]; then
            echo "ERROR: Expected MainActivity.kt was not generated."
            find android/app/src/main -name 'MainActivity.*' -print
            exit 1
          fi

          cat "$ACTIVITY"

          if grep -RInE \
            --include='*.kt' \
            --include='*.java' \
            --include='*.xml' \
            'io\.flutter\.app\.FlutterActivity|io\.flutter\.app\.FlutterApplication|io\.flutter\.view\.FlutterMain|PluginRegistry\.Registrar' \
            android; then
            echo "ERROR: Legacy Android embedding references remain."
            exit 1
          fi

          echo "Android scaffold regenerated."

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Analyze Flutter code
        run: flutter analyze --no-pub

      - name: Build release APK
        run: |
          flutter build apk \
            --release \
            --target-platform android-arm64 \
            --verbose

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="build/app/outputs/flutter-apk/app-release.apk"

          test -f "$APK"

          ls -lh "$APK"
          sha256sum "$APK"
          unzip -t "$APK"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: MAFX-SHARE-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
