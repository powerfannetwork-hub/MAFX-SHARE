name: Build MAFX SHARE

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.0"
          channel: stable
          cache: true

      - name: Check versions
        run: |
          flutter --version
          dart --version
          java -version

      - name: Check project files
        run: |
          test -f pubspec.yaml
          test -f lib/main.dart
          test -f android/app/src/main/AndroidManifest.xml

      - name: Generate clean Android V2 project
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/mafx-project"

          flutter create \
            --platforms=android \
            --org com.mafx \
            --project-name share \
            "$RUNNER_TEMP/mafx-project"

          test -f \
            "$RUNNER_TEMP/mafx-project/android/app/src/main/kotlin/com/mafx/share/MainActivity.kt"

          grep -q \
            'io.flutter.embedding.android.FlutterActivity' \
            "$RUNNER_TEMP/mafx-project/android/app/src/main/kotlin/com/mafx/share/MainActivity.kt"

          cp android/app/src/main/AndroidManifest.xml \
            "$RUNNER_TEMP/mafx-manifest.xml"

          rm -rf android

          cp -a "$RUNNER_TEMP/mafx-project/android" android

          cp "$RUNNER_TEMP/mafx-manifest.xml" \
            android/app/src/main/AndroidManifest.xml

          if grep -RInE \
            --include='*.kt' \
            --include='*.java' \
            'io\.flutter\.app\.FlutterActivity|io\.flutter\.app\.FlutterApplication|PluginRegistry\.Registrar' \
            android; then
            echo "ERROR: Legacy Android embedding detected."
            exit 1
          fi

          echo "Android V2 verification passed."

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze Flutter code
        run: flutter analyze --no-pub

      - name: Build release APK
        run: flutter build apk --release --target-platform android-arm64

      - name: Verify APK
        run: |
          set -euo pipefail

          APK="build/app/outputs/flutter-apk/app-release.apk"

          test -s "$APK"

          ls -lh "$APK"
          sha256sum "$APK"
          unzip -t "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MAFX-SHARE-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
