name: Build MAFX SHARE

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.0"
          channel: stable
          cache: true

      - name: Check versions
        run: |
          flutter --version
          dart --version
          java -version

      - name: Check project files
        run: |
          set -euo pipefail

          test -f pubspec.yaml
          test -f lib/main.dart
          test -f android/app/src/main/AndroidManifest.xml

      - name: Generate clean Android V2 project
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/mafx-project"

          flutter create \
            --platforms=android \
            --org com.mafx \
            --project-name share \
            "$RUNNER_TEMP/mafx-project"

          test -f \
            "$RUNNER_TEMP/mafx-project/android/app/src/main/kotlin/com/mafx/share/MainActivity.kt"

          grep -q \
            'io.flutter.embedding.android.FlutterActivity' \
            "$RUNNER_TEMP/mafx-project/android/app/src/main/kotlin/com/mafx/share/MainActivity.kt"

          cp android/app/src/main/AndroidManifest.xml \
            "$RUNNER_TEMP/mafx-manifest.xml"

          rm -rf android

          cp -a "$RUNNER_TEMP/mafx-project/android" android

          cp "$RUNNER_TEMP/mafx-manifest.xml" \
            android/app/src/main/AndroidManifest.xml

          if grep -RInE \
            --include='*.kt' \
            --include='*.java' \
            'io\.flutter\.app\.FlutterActivity|io\.flutter\.app\.FlutterApplication|PluginRegistry\.Registrar' \
            android; then
            echo "ERROR: Legacy Android embedding detected."
            exit 1
          fi

          echo "Android V2 verification passed."

      - name: Configure Android SDK versions
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          gradle_file = Path("android/app/build.gradle.kts")
          text = gradle_file.read_text()

          replacements = [
              (
                  r'(?m)^(\s*)compileSdk\s*=\s*.*$',
                  r'\g<1>compileSdk = 36',
              ),
              (
                  r'(?m)^(\s*)ndkVersion\s*=\s*.*$',
                  r'\g<1>ndkVersion = "27.0.12077973"',
              ),
              (
                  r'(?m)^(\s*)minSdk\s*=\s*.*$',
                  r'\g<1>minSdk = 23',
              ),
          ]

          for pattern, replacement in replacements:
              text, count = re.subn(
                  pattern,
                  replacement,
                  text,
                  count=1,
              )

              if count != 1:
                  raise SystemExit(
                      f"ERROR: Could not update Gradle setting: {pattern}"
                  )

          gradle_file.write_text(text)
          print("Android SDK configuration updated.")
          PY

          echo "Checking Android SDK configuration..."

          grep -nE \
            'compileSdk = 36|ndkVersion = "27.0.12077973"|minSdk = 23' \
            android/app/build.gradle.kts

          grep -q 'compileSdk = 36' \
            android/app/build.gradle.kts

          grep -q 'ndkVersion = "27.0.12077973"' \
            android/app/build.gradle.kts

          grep -q 'minSdk = 23' \
            android/app/build.gradle.kts

          echo "Android SDK configuration verified."

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze Flutter code
        run: flutter analyze --no-pub

      - name: Build release APK
        run: flutter build apk --release --target-platform android-arm64

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -s "$APK" ]; then
            echo "ERROR: APK was not created."
            exit 1
          fi

          ls -lh "$APK"
          sha256sum "$APK"
          unzip -t "$APK"

          echo "APK verification passed."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MAFX-SHARE-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
