name: Build MAFX SHARE APK

'on':
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build MAFX SHARE APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify Project Structure
        shell: bash
        run: |
          set -eu

          echo "========== PROJECT STRUCTURE =========="

          for FILE in \
            pubspec.yaml \
            lib/main.dart \
            android/settings.gradle.kts \
            android/app/build.gradle.kts \
            android/app/src/main/AndroidManifest.xml
          do
            if [ -f "$FILE" ]; then
              echo "OK: $FILE"
            else
              echo "ERROR: Missing file: $FILE"
              exit 1
            fi
          done

          echo ""
          flutter --version
          java -version

      - name: Scan Android Project Before Pub Get
        if: always()
        shell: bash
        run: |
          echo "========== ANDROID PROJECT FILES =========="

          find android -type f \
            \( -name '*.kt' \
            -o -name '*.java' \
            -o -name '*.xml' \
            -o -name '*.gradle' \
            -o -name '*.gradle.kts' \) \
            -not -path '*/build/*' \
            -print | sort

          echo ""
          echo "========== MAIN ACTIVITY FILES =========="

          find . -type f \
            \( -name 'MainActivity.kt' \
            -o -name 'MainActivity.java' \) \
            -not -path './.git/*' \
            -not -path './build/*' \
            -not -path './.dart_tool/*' \
            -print

          echo ""
          echo "========== LEGACY EMBEDDING REFERENCES =========="

          grep -RInE \
            --include='*.kt' \
            --include='*.java' \
            --include='*.xml' \
            --include='*.gradle' \
            --include='*.gradle.kts' \
            --include='*.dart' \
            --exclude-dir=.git \
            --exclude-dir=build \
            --exclude-dir=.dart_tool \
            --exclude-dir=.gradle \
            'io\.flutter\.app\.FlutterActivity|io\.flutter\.app\.FlutterApplication|io\.flutter\.app\.FlutterActivityDelegate|io\.flutter\.view\.FlutterMain|io\.flutter\.view\.FlutterNativeView|PluginRegistry\.Registrar' \
            . || true

          echo ""
          echo "========== MANIFEST FILES =========="

          find . -type f \
            -name AndroidManifest.xml \
            -not -path './.git/*' \
            -not -path './build/*' \
            -not -path './.dart_tool/*' \
            -print

      - name: Get Flutter Dependencies
        id: pub_get
        shell: bash
        run: |
          set -o pipefail

          flutter pub get -v 2>&1 \
            | tee "$RUNNER_TEMP/pub-get.log"

      - name: Report Pub Get Failure
        if: failure() && steps.pub_get.outcome == 'failure'
        shell: bash
        run: |
          echo "========== PUB GET ERROR REPORT =========="

          if [ -f "$RUNNER_TEMP/pub-get.log" ]; then
            grep -n -i -B 10 -A 15 \
              -E 'deleted Android v1 embedding|checkForDeprecation|error|exception|failed|AndroidManifest.xml' \
              "$RUNNER_TEMP/pub-get.log" || true

            echo ""
            echo "========== LAST 150 LINES =========="

            tail -n 150 "$RUNNER_TEMP/pub-get.log"
          fi

      - name: Analyze Flutter Code
        id: analyze
        shell: bash
        run: |
          set -o pipefail

          flutter analyze --no-pub 2>&1 \
            | tee "$RUNNER_TEMP/flutter-analyze.log"

      - name: Build Release APK
        id: build_apk
        shell: bash
        run: |
          set -o pipefail

          flutter build apk \
            --release \
            --target-platform android-arm64 \
            --verbose 2>&1 \
            | tee "$RUNNER_TEMP/flutter-build.log"

      - name: Report Build Failure
        if: failure()
        shell: bash
        run: |
          echo "=========================================="
          echo " MAFX SHARE - BUILD FAILURE REPORT"
          echo "=========================================="

          for LOG in \
            "$RUNNER_TEMP/pub-get.log" \
            "$RUNNER_TEMP/flutter-analyze.log" \
            "$RUNNER_TEMP/flutter-build.log"
          do
            if [ -f "$LOG" ]; then
              echo ""
              echo "========== $LOG =========="

              grep -n -i -B 8 -A 12 \
                -E 'deleted Android v1 embedding|checkForDeprecation|error:|exception|caused by:|failed|AndroidManifest.xml|\.kt:[0-9]+|\.java:[0-9]+' \
                "$LOG" | tail -n 250 || true

              echo ""
              echo "========== LAST 100 LINES =========="

              tail -n 100 "$LOG"
            fi
          done

      - name: Verify APK
        if: success()
        shell: bash
        run: |
          set -eu

          APK="build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK not found: $APK"
            exit 1
          fi

          echo "========== APK INFORMATION =========="

          ls -lh "$APK"
          file "$APK"

          echo ""
          echo "========== SHA-256 =========="

          sha256sum "$APK"

          echo ""
          echo "========== VERIFY APK ARCHIVE =========="

          unzip -t "$APK"

      - name: Upload Release APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MAFX-SHARE-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Diagnostic Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MAFX-SHARE-diagnostic-logs
          path: |
            ${{ runner.temp }}/pub-get.log
            ${{ runner.temp }}/flutter-analyze.log
            ${{ runner.temp }}/flutter-build.log
          if-no-files-found: ignore
          retention-days: 7
