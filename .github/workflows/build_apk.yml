name: Build MAFX SHARE APK

'on':
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build MAFX SHARE APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify project structure
        shell: bash
        run: |
          set -e

          echo "========== PROJECT STRUCTURE =========="

          for FILE in \
            pubspec.yaml \
            lib/main.dart \
            android/settings.gradle.kts \
            android/app/build.gradle.kts \
            android/app/src/main/AndroidManifest.xml
          do
            if [ -f "$FILE" ]; then
              echo "OK: $FILE"
            else
              echo "ERROR: Missing file: $FILE"
              exit 1
            fi
          done

          echo ""
          flutter --version
          java -version

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Scan for Android V1 Embedding
        if: always()
        shell: bash
        run: |
          echo "=========================================="
          echo " MAFX SHARE - V1 EMBEDDING SCAN"
          echo "=========================================="

          REPORT="$RUNNER_TEMP/embedding-report.txt"
          touch "$REPORT"

          echo ""
          echo "========== MAIN ACTIVITY FILES =========="

          find android -type f \
            \( -name 'MainActivity.kt' -o -name 'MainActivity.java' \) \
            -print | tee -a "$REPORT"

          echo ""
          echo "========== SEARCHING SOURCE FILES =========="

          grep -RInE \
            --include='*.kt' \
            --include='*.java' \
            --include='*.xml' \
            --include='*.gradle' \
            --include='*.gradle.kts' \
            --include='*.dart' \
            --exclude-dir=.git \
            --exclude-dir=build \
            --exclude-dir=.gradle \
            --exclude-dir=.dart_tool \
            'io\.flutter\.app\.FlutterActivity|io\.flutter\.app\.FlutterApplication|io\.flutter\.app\.FlutterActivityDelegate|io\.flutter\.view\.FlutterMain|io\.flutter\.view\.FlutterNativeView|PluginRegistry\.Registrar' \
            . 2>/dev/null | tee -a "$REPORT" || true

          echo ""
          echo "========== ANDROID MANIFEST FILES =========="

          find . -type f \
            -name AndroidManifest.xml \
            -not -path './.git/*' \
            -not -path './build/*' \
            -not -path './.gradle/*' \
            -print | tee -a "$REPORT"

          echo ""
          echo "========== EMBEDDING METADATA =========="

          if [ -f android/app/src/main/AndroidManifest.xml ]; then
            grep -n -A 3 -B 3 'flutterEmbedding' \
              android/app/src/main/AndroidManifest.xml || true
          fi

          echo ""
          echo "========== PLUGIN DEPENDENCIES =========="

          if [ -f .flutter-plugins-dependencies ]; then
            python3 - <<'PY'
          import json

          filename = ".flutter-plugins-dependencies"

          with open(filename, encoding="utf-8") as file:
              data = json.load(file)

          for platform in ("android",):
              for plugin in data.get("plugins", {}).get(platform, []):
                  print(
                      "Plugin:", plugin.get("name", "unknown"),
                      "| Path:", plugin.get("path", "unknown")
                  )
          PY
          else
            echo "Flutter plugin metadata not found."
          fi

          echo ""
          echo "========== SCAN FINISHED =========="

      - name: Analyze Flutter code
        id: analyze
        shell: bash
        run: |
          set -o pipefail
          flutter analyze --no-pub 2>&1 \
            | tee "$RUNNER_TEMP/flutter-analyze.log"

      - name: Build release APK
        id: build_apk
        shell: bash
        run: |
          set -o pipefail

          flutter build apk \
            --release \
            --target-platform android-arm64 \
            --verbose 2>&1 \
            | tee "$RUNNER_TEMP/flutter-build.log"

      - name: Report Flutter Build Error
        if: failure()
        shell: bash
        run: |
          echo "=========================================="
          echo " MAFX SHARE - BUILD ERROR REPORT"
          echo "=========================================="

          for LOG in \
            "$RUNNER_TEMP/flutter-analyze.log" \
            "$RUNNER_TEMP/flutter-build.log"
          do
            if [ -f "$LOG" ]; then
              echo ""
              echo "========== $LOG =========="

              grep -n -i -B 5 -A 8 -E \
                'deleted Android v1 embedding|error:|exception|caused by:|failed|\.kt:[0-9]+|\.java:[0-9]+' \
                "$LOG" | tail -n 200 || true

              echo ""
              echo "========== LAST 100 LINES =========="

              tail -n 100 "$LOG"
            fi
          done

      - name: Verify APK
        if: success()
        shell: bash
        run: |
          set -e

          APK="build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK file not found: $APK"
            exit 1
          fi

          echo "========== APK INFORMATION =========="

          ls -lh "$APK"
          file "$APK"

          echo ""
          echo "========== SHA-256 =========="

          sha256sum "$APK"

          echo ""
          echo "========== VERIFY APK ARCHIVE =========="

          unzip -t "$APK"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MAFX-SHARE-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Diagnostic Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MAFX-SHARE-diagnostic-logs
          path: |
            ${{ runner.temp }}/embedding-report.txt
            ${{ runner.temp }}/flutter-analyze.log
            ${{ runner.temp }}/flutter-build.log
          if-no-files-found: ignore
          retention-days: 7
