name: Build MAFX SHARE APK

'on':
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build MAFX SHARE APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify project structure
        run: |
          test -f pubspec.yaml || {
            echo "ERROR: pubspec.yaml is missing"
            exit 1
          }

          test -f lib/main.dart || {
            echo "ERROR: lib/main.dart is missing"
            exit 1
          }

          test -f android/app/build.gradle.kts || {
            echo "ERROR: Android app Gradle file is missing"
            exit 1
          }

          test -f android/app/src/main/AndroidManifest.xml || {
            echo "ERROR: AndroidManifest.xml is missing"
            exit 1
          }

          flutter --version
          java -version

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Analyze Flutter code
        run: flutter analyze --no-pub

      - name: Build release APK
        run: flutter build apk --release --target-platform android-arm64

      - name: Verify APK
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"

          test -f "$APK" || {
            echo "ERROR: APK was not created"
            exit 1
          }

          echo "APK file information:"
          ls -lh "$APK"
          file "$APK"

          echo "APK SHA-256:"
          sha256sum "$APK"

          echo "Checking APK archive..."
          unzip -t "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MAFX-SHARE-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
