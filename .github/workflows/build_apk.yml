name: Build MAFX SHARE APK

on:
workflow_dispatch:
push:
branches:
- main

permissions:
contents: read

jobs:
build:
name: Build and Verify Android APK
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Set up Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Set up Flutter
    uses: subosito/flutter-action@v2
    with:
      channel: stable
      cache: true

  - name: Check project files
    run: |
      test -f pubspec.yaml || {
        echo "ERROR: pubspec.yaml is missing from the repository root."
        exit 1
      }

      test -f lib/main.dart || {
        echo "ERROR: lib/main.dart is missing."
        exit 1
      }

      flutter --version
      java -version

  - name: Regenerate Android project scaffold
    run: |
      flutter create \
        --no-pub \
        --platforms=android \
        --org com.mafx \
        --project-name share \
        --android-language kotlin \
        .

  - name: Remove incompatible default test
    run: |
      rm -f test/widget_test.dart

  - name: Get Flutter dependencies
    run: flutter pub get

  - name: Analyze Flutter code
    run: flutter analyze --no-pub

  - name: Build release APK
    run: flutter build apk --release --target-platform android-arm64

  - name: Verify APK exists
    run: |
      APK="build/app/outputs/flutter-apk/app-release.apk"

      if [ ! -f "$APK" ]; then
        echo "ERROR: Release APK was not created."
        exit 1
      fi

      echo "APK size:"
      ls -lh "$APK"

      echo "APK SHA-256:"
      sha256sum "$APK"

  - name: Upload release APK
    uses: actions/upload-artifact@v4
    with:
      name: mafx-share-apk
      path: build/app/outputs/flutter-apk/app-release.apk
      if-no-files-found: error
      retention-days: 14
