name: Build MAFX SHARE APK

'on':
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build MAFX SHARE APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify project structure
        shell: bash
        run: |
          set -e

          echo "=== PROJECT STRUCTURE ==="

          for FILE in \
            pubspec.yaml \
            lib/main.dart \
            android/settings.gradle.kts \
            android/app/build.gradle.kts \
            android/app/src/main/AndroidManifest.xml
          do
            if [ -f "$FILE" ]; then
              echo "OK: $FILE"
            else
              echo "ERROR: Missing file: $FILE"
              exit 1
            fi
          done

          echo ""
          flutter --version
          java -version

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Analyze Flutter code
        run: flutter analyze --no-pub

      - name: Diagnose Android V1 Embedding
        id: diagnose
        shell: bash
        run: |
          echo "=========================================="
          echo " MAFX SHARE - ANDROID ERROR DIAGNOSTICS"
          echo "=========================================="

          REPORT="$RUNNER_TEMP/android-diagnostics.txt"
          : > "$REPORT"

          FOUND=0

          echo ""
          echo "=== 1. SEARCHING PROJECT SOURCE FILES ==="

          if git grep -n -I -E \
            'io\.flutter\.app\.FlutterActivity|io\.flutter\.app\.FlutterApplication|io\.flutter\.app\.FlutterActivityDelegate|io\.flutter\.view\.FlutterMain|io\.flutter\.view\.FlutterNativeView|PluginRegistry\.Registrar' \
            -- '*.kt' '*.java' '*.xml' '*.gradle' '*.gradle.kts' '*.dart' '*.yaml' '*.yml' \
            > "$RUNNER_TEMP/v1-matches.txt"; then

            cat "$RUNNER_TEMP/v1-matches.txt"

            while IFS= read -r MATCH; do
              echo "POSSIBLE V1 EMBEDDING: $MATCH" | tee -a "$REPORT"
              FOUND=1
            done < "$RUNNER_TEMP/v1-matches.txt"

          else
            echo "No common V1 embedding references found."
          fi

          echo ""
          echo "=== 2. FINDING ANDROID ENTRY POINTS ==="

          find android -type f \
            \( -name 'MainActivity.kt' -o -name 'MainActivity.java' \) \
            -print | tee -a "$REPORT"

          echo ""
          echo "=== 3. CHECKING ANDROID MANIFESTS ==="

          while IFS= read -r -d '' FILE; do
            echo "Checking: $FILE"

            if grep -n -E \
              'io\.flutter\.app\.FlutterActivity|io\.flutter\.app\.FlutterApplication|io\.flutter\.app\.android\.SplashScreenUntilFirstFrame' \
              "$FILE"; then

              echo "ERROR: Legacy embedding reference in $FILE" \
                | tee -a "$REPORT"

              FOUND=1
            fi
          done < <(find android -name AndroidManifest.xml -print0)

          echo ""
          echo "=== 4. CHECKING FLUTTER EMBEDDING VERSION ==="

          MANIFEST="android/app/src/main/AndroidManifest.xml"

          if [ -f "$MANIFEST" ]; then
            grep -n -A 2 -B 2 'flutterEmbedding' "$MANIFEST" \
              || echo "WARNING: flutterEmbedding metadata not found"
          fi

          echo ""
          echo "=== 5. CHECKING DEPENDENCY FILES ==="

          if [ -f .flutter-plugins-dependencies ]; then
            python3 - <<'PY'
          import json

          path = ".flutter-plugins-dependencies"

          try:
              with open(path, encoding="utf-8") as f:
                  data = json.load(f)

              for plugin in data.get("plugins", {}).get("android", []):
                  print(
                      "PLUGIN:",
                      plugin.get("name", "unknown"),
                      "| PATH:",
                      plugin.get("path", "unknown")
                  )
          except Exception as error:
              print("Could not parse plugin metadata:", error)
          PY
          else
            echo "No .flutter-plugins-dependencies file found."
          fi

          echo ""
          echo "=== DIAGNOSTIC SUMMARY ==="

          if [ "$FOUND" -eq 1 ]; then
            echo "Possible legacy embedding references were found."
            echo "Inspect the file paths and line numbers above."
          else
            echo "No common V1 embedding references found in tracked source files."
            echo "The build log may be needed to identify the exact cause."
          fi

          echo "Diagnostics finished."

      - name: Build release APK
        id: build_apk
        shell: bash
        run: |
          set -o pipefail

          flutter build apk \
            --release \
            --target-platform android-arm64 \
            --verbose 2>&1 | tee "$RUNNER_TEMP/flutter-build.log"

      - name: Diagnose failed APK build
        if: failure() && steps.build_apk.outcome == 'failure'
        shell: bash
        run: |
          echo "=========================================="
          echo " APK BUILD FAILED - ERROR REPORT"
          echo "=========================================="

          LOG="$RUNNER_TEMP/flutter-build.log"

          if [ -f "$LOG" ]; then
            echo ""
            echo "=== ERROR MESSAGES ==="

            grep -n -i -B 5 -A 8 -E \
              'deleted Android v1 embedding|error:|exception|failed|caused by:|\.kt:[0-9]+|\.java:[0-9]+' \
              "$LOG" | tail -n 250 || true

            echo ""
            echo "=== LAST 150 LOG LINES ==="
            tail -n 150 "$LOG"
          else
            echo "Flutter build log was not created."
          fi

      - name: Verify APK
        if: success()
        shell: bash
        run: |
          set -e

          APK="build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not created: $APK"
            exit 1
          fi

          echo "=== APK INFORMATION ==="
          ls -lh "$APK"
          file "$APK"

          echo ""
          echo "=== SHA-256 ==="
          sha256sum "$APK"

          echo ""
          echo "=== APK ARCHIVE VALIDATION ==="
          unzip -t "$APK"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MAFX-SHARE-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MAFX-SHARE-diagnostic-log
          path: |
            ${{ runner.temp }}/flutter-build.log
            ${{ runner.temp }}/android-diagnostics.txt
          if-no-files-found: ignore
          retention-days: 7
