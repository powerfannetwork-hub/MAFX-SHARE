name: mafx_share
description: MAFX SHARE - Offline File Sharing
publish_to: none
version: 1.0.1+2

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
     photo_manager: ^3.7.1
device_info_plus: ^11.3.0
  cupertino_icons: ^1.0.8

  # File selection
  file_picker: ^8.1.7

  # QR code generation
  qr_flutter: ^4.1.0

  # QR code scanning
  mobile_scanner: ^6.0.2

  # Save transfer history and settings
  shared_preferences: ^2.3.4
  path_provider: ^2.1.5
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
